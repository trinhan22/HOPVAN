<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HopVan - Loading...</title>
    <meta property="og:title" content="HOPVAN - Nền Tảng Học & Luyện Thi Ngữ Văn" />
    <meta property="og:description" content="Nền tảng học tập Ngữ Văn tích hợp AI – hỗ trợ tự học thông minh." />
    <meta property="og:image" content="https://hopvan.netlify.app/panel-final.webp" />
    
    <link rel="icon" href="https://hopvan.info.vn/LOGO.WEBP" />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --primary: #FF8F50;
            --secondary: #FF5E62;
            --text: #2d3436;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body, html { 
            width: 100%; height: 100%; overflow: hidden; 
            background: #fff;
            font-family: 'Montserrat', sans-serif;
        }

        h1, p, span, div, b { font-family: 'Montserrat', sans-serif !important; }
        
        i, .fa-solid, .fas, .fa-brands { 
            font-family: "Font Awesome 6 Free" !important; 
            font-weight: 900 !important; 
            font-style: normal !important;
        }

        #viewport-container { 
            width: 100%; height: 100%; overflow: hidden; 
            background: radial-gradient(circle at center, #fffcf9 0%, #fff0e3 100%);
            position: relative;
            display: flex; justify-content: center; align-items: center;
        }

        .grid-floor { 
            position: absolute; width: 200%; height: 200%; top: -50%; left: -50%; 
            background-image: linear-gradient(rgba(255, 94, 98, 0.04) 1px, transparent 1px), 
                              linear-gradient(90deg, rgba(255, 94, 98, 0.04) 1px, transparent 1px); 
            background-size: 100px 100px; 
            transform: perspective(1000px) rotateX(60deg); 
            animation: gridFlow 15s linear infinite; 
            z-index: 1; opacity: 0.6;
        }
        @keyframes gridFlow { 0% { transform: perspective(1000px) rotateX(60deg) translateY(0); } 100% { transform: perspective(1000px) rotateX(60deg) translateY(100px); } }

        .scene-container { position: relative; z-index: 10; width: 100%; height: 100%; }

        .scene {
            position: absolute; inset: 0;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; visibility: hidden;
            text-align: center;
            will-change: opacity;
        }

        .headline { font-size: 2.8rem; font-weight: 900; line-height: 1.35; color: var(--text); text-transform: uppercase; letter-spacing: -1px; }
        .gradient-text { background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: inline-block; padding-top: 4px; }
        
        .icon-box { font-size: 4.5rem; margin-bottom: 20px; color: var(--primary); }
        .badge { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; color: var(--secondary); margin-bottom: 12px; background: rgba(255, 94, 98, 0.08); padding: 5px 22px; border-radius: 50px; letter-spacing: 2px; }

        .loader-wrap { position: fixed; bottom: 50px; left: 50%; transform: translateX(-50%); width: 220px; height: 3px; background: rgba(0,0,0,0.05); border-radius: 10px; overflow: hidden; z-index: 100; }
        .loader-bar { width: 0%; height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); }
    </style>
</head>
<body>

    <audio id="bg-music" loop src="https://assets.mixkit.co/music/preview/mixkit-tech-house-vibes-130.mp3"></audio>

    <div id="viewport-container">
        <div class="grid-floor"></div>
        
        <div class="scene-container">
            <div class="scene" id="s1">
                <img src="LOGO.WEBP" style="width: 140px; margin-bottom: 12px; border-radius: 35px; box-shadow: 0 15px 40px rgba(255, 143, 80, 0.3);">
                <h1 class="headline" style="font-size: 3.5rem; font-weight: 900; letter-spacing: 0.5px; color: #1e293b; line-height: 1.1; margin-bottom: 5px;">HOPVAN</h1>
                <p style="font-size: 0.85rem; font-weight: 800; color: #64748b; margin-top: 0px; letter-spacing: 0.5px;">Nền Tảng Học & Luyện Thi Ngữ Văn</p>
            </div>
            
            <div class="scene" id="s2">
                <div class="badge" style="background: rgba(234, 88, 12, 0.1); color: #ea580c; border: 1px solid rgba(234, 88, 12, 0.2); letter-spacing: 1px; font-size: 0.65rem; margin-bottom: 15px;">Đơn Vị Chủ Quản</div>
                <img src="fpt.png" style="width: 150px; margin-bottom: 5px; filter: drop-shadow(0 5px 15px rgba(0,0,0,0.1));" alt="FPT Logo">
                <h1 class="headline" style="font-size: 1.8rem;">DỰ ÁN TRỰC THUỘC<br><span style="background: linear-gradient(135deg, #f97316, #ef4444); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: inline-block; margin-top: 4px; font-size: 2.6rem;">TỔ NGỮ VĂN</span></h1>
                <p style="font-size: 1rem; font-weight: 800; color: #334155; margin-top: 2px; letter-spacing: 0.5px;">TRƯỜNG THPT FPT CẦN THƠ</p>
            </div>
        </div>

        <div class="loader-wrap">
            <div class="loader-bar" id="bar"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <script>
        const audio = document.getElementById('bg-music');
        
        // Timeline chính
        const tl = gsap.timeline({ 
            paused: true,
            onUpdate: function() {
                // ĐỒNG BỘ THỰC TẾ: Thanh tiến độ chạy chính xác theo % hoàn thành của Timeline chữ
                document.getElementById('bar').style.width = (this.progress() * 100) + "%";
            },
            onComplete: () => { 
                gsap.to("body", { opacity: 0, duration: 0.4, onComplete: () => {
                    
                    // KIỂM TRA IFRAME: Nếu đang chạy dưới dạng loading nền của Dashboard thì không tự chuyển trang
                    if (window.self !== window.top) {
                        return; // Dừng lại, để Dashboard tự làm mờ và tắt Iframe
                    } 
                    // Nếu chạy độc lập như trang splash screen bình thường thì chuyển hướng
                    else {
                        window.location.href = 'dashboard/'; 
                    }

                }});
            }
        });

        function initAnimation() {
            // Thiết lập chính xác 3 giây cho toàn bộ timeline loading
            // S1 hiện từ 0s -> 1.3s
            tl.fromTo('#s1', { autoAlpha: 0 }, { autoAlpha: 1, visibility: 'visible', duration: 0.5, ease: "power2.out" }, 0)
              .to('#s1', { autoAlpha: 0, duration: 0.5, ease: "power2.inOut" }, 1.0);
              
            // S2 hiện từ 1.3s -> 3.0s
            tl.fromTo('#s2', { autoAlpha: 0 }, { autoAlpha: 1, visibility: 'visible', duration: 0.5, ease: "power2.out" }, 1.3)
              .set({}, {}, 3.0); 
        }

        window.addEventListener('load', () => {
            initAnimation();
            try { 
                audio.volume = 0.4;
                audio.play(); 
            } catch(e) {}
            tl.play();
        });
        
        // --- DARK MODE LOGIC ---
        try {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark') {
                const darkStyle = document.createElement('style');
                darkStyle.innerHTML = `
                    body, html { background: #0B1120 !important; }
                    #viewport-container { background: radial-gradient(circle at center, #0f172a 0%, #020617 100%) !important; }
                    .grid-floor { background-image: linear-gradient(rgba(255, 94, 98, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 94, 98, 0.1) 1px, transparent 1px) !important; }
                    .text-gradient { background: linear-gradient(135deg, #FFB380, #FF8F50) !important; -webkit-background-clip: text !important; -webkit-text-fill-color: transparent !important; }
                    h1, p, span { color: #f8fafc !important; }
                    .progress-bar-container { background: #1e293b !important; }
                `;
                document.head.appendChild(darkStyle);
            }
        } catch(e) {}
    </script>

<script type="text/javascript">
    // 1. Chặn Chuột phải (Để ẩn menu "Inspect/Kiểm tra" và "View Source/Xem nguồn")
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        // Không hiện thông báo gì cả để trải nghiệm mượt mà hơn
    });

    // 2. Chặn các phím tắt Developer Tools
    document.addEventListener('keydown', function(e) {
        // Chặn F12
        if (e.key === 'F12' || e.keyCode === 123) {
            e.preventDefault();
            return false;
        }

        // Chặn các tổ hợp phím Ctrl + ...
        if (e.ctrlKey) {
            switch (e.key.toLowerCase()) {
                case 'u': // Chặn Ctrl + U (Xem source code)
                case 's': // Chặn Ctrl + S (Lưu trang web)
                case 'p': // Chặn Ctrl + P (In trang web - thường hiện code)
                // Lưu ý: KHÔNG chặn 'c' (Copy) và 'a' (Select All)
                    e.preventDefault();
                    return false;
            }

            // Chặn Ctrl + Shift + ... (Các phím mở DevTools)
            if (e.shiftKey) {
                switch (e.key.toLowerCase()) {
                    case 'i': // Inspect Element
                    case 'j': // Console
                    case 'c': // Element Inspector
                        e.preventDefault();
                        return false;
                }
            }
        }
    });
</script>
</body>
</html>
